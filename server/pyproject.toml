[project]
name = "gothic-ai-server"
version = "0.1.0"
description = "AI server that drives NPCs in Gothic 2 (OpenGothic fork) over WebSocket"
authors = [
    { name = "Kaifat", email = "11953142+kaifaty@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.0",
    "websockets>=17.2",
]

[project.scripts]
gothic-ai = "gothic_ai.cli:main"

[tool.uv.build-backend]
module-name = "gothic_ai"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# per-request deadlines are part of the GameLink API
ignore = ["ASYNC109"]
