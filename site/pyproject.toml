[project]
name = "gothic-site"
version = "0.1.0"
description = "The project's site on GitHub Pages: what works now and the devlog, in English and Russian"
authors = [
    { name = "Kaifat", email = "11953142+kaifaty@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.7",
]

[project.scripts]
gothic-site = "gothic_site.cli:main"

[tool.uv.build-backend]
module-name = "gothic_site"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
