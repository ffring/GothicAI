[project]
name = "gothic-body-service"
version = "0.1.0"
description = "Bounded numerical NPC primitive policies and behavioral cloning"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3"]

[project.scripts]
gothic-body = "gothic_body.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gothic_body"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
