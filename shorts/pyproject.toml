[project]
name = "gothic-shorts"
version = "0.1.0"
description = "Shorts from the game: a scripted scene with real AI npc's, filmed on the test bench and cut vertical"
authors = [
    { name = "Kaifat", email = "11953142+kaifaty@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gothic-launcher",
    "httpx>=0.28.1",
    "pillow>=11.0",
]

[project.scripts]
gothic-shorts = "gothic_shorts.cli:main"

[tool.uv.sources]
gothic-launcher = { path = "../launcher/core", editable = true }

[tool.uv.build-backend]
module-name = "gothic_shorts"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
