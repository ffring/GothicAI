title = "Ксардас реагирует сразу"
hook = "Он реагирует, пока думает"
description = """
Ответы NPC не прописаны заранее: Ксардас слышит голос героя через распознавание речи и отвечает
языковой моделью. Первый звук («Что?!», «Тьфу!», «Ой ли?») он издаёт сразу, через 0,2 с после фразы:
его по смыслу фразы выбирает маленькая модель на видеокарте, пока большая думает над ответом, и ответ
продолжает этот звук. Звуки стоят там, где прозвучали; паузы, пока большая модель думает, вырезаны.
"""
npc = "NONE_100_XARDAS"

script = """
overlay off
ai attach {npc}            # he stops his routine and stands: his lines go through the game's queue
wait 500
near {npc} 170
face npc {npc}
cam shoulder {npc} 130 15 1
wait 300
rec main
wait 800
hero Ксардас, орки напали на город!
cam cut
cam face {npc} 150 0 25    # his face for the sound, 0.2 s after the phrase
waitreply 40000
cam cut
cam shoulder {npc} 130 15 1
hero Ты — старый дурак.
cam cut
cam face {npc} 150 0 25
waitreply 40000
cam cut
cam shoulder {npc} 130 15 1
hero Я убил дракона голыми руками.
cam cut
cam face {npc} 150 0 25
waitreply 40000
wait 500
stop
"""
