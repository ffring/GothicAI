title = "Нахамил Ксардасу"
hook = "Я нахамил Ксардасу"
brand = false
description = """
Ответы NPC не прописаны заранее: Ксардас слышит голос героя через распознавание речи и отвечает
языковой моделью, она же решает, задела ли его дерзость. Когда терпение кончается, игра сама разыгрывает
его ответ. Паузы, пока модель думает, вырезаны.
"""
npc = "NONE_100_XARDAS"
server_args = ["--wrath"]  # the necromancer's answer (docs/xardas-wrath.md)
timeout = 360

script = """
overlay off
ai attach {npc}            # he stops his routine and stands: his lines go through the game's queue
wait 500
near {npc} 170 -45         # on the pentagram, nothing between the camera and the fall
face npc {npc}
cam shoulder {npc} 130 15 1
wait 300
rec main
wait 800
hero Ксардас, а ты не староват для всей этой магии?
waitreply 40000
cam face {npc} 150 0 25
hero Слушай, некромант недоделанный, ты хоть что-нибудь умеешь, кроме болтовни?
waitreply 40000
cam shoulder {npc} 130 15 1
hero Знаешь, твоя мамаша, небось, тоже только болтать умела.
waitreply 40000
waitai necro fallen 30000  # the spell over his shoulder; he falls
cam cut
cam world 330 200 90       # the body and Xardas, from the side
wait 100
cam fixed                  # it turns after the body
waitai necro risen 15000   # the summoning; he begins to get up
wait 700
cam cut
cam shoulder {npc} 130 15 1  # the skeleton before its master
ui on                      # the end card is drawn over the game
waitai necro card 10000
wait 4500                  # the black, then the picture a few seconds
stop
"""
