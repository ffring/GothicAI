# Фразы героя для дообучения вопроса `voice` (server/src/gothic_ai/brain/reflex.py): какой звук NPC
# издаёт сразу, пока думает над ответом. Каждая фраза стоит под своим лучшим типом; разметка вручную
# (Claude), по тем же правилам, что evals/talk-reactions/phrases.yaml:
#
#   none        — приветствие, прощание, «спасибо», болтовня, короткое согласие;
#   think       — вопрос или просьба, над которыми надо подумать;
#   ack         — обычное сообщение: что сделал, где был, что видел, кто передал;
#   surprise    — тревожная или ошеломляющая новость: нападение, смерть, беда, большая находка;
#   displeasure — оскорбление, насмешка, угроза, «ты врёшь», грубое требование;
#   doubt       — хвастовство, неправдоподобное заявление о себе.
#
# {name} — имя NPC, которому сказано. Фраз из теста (evals/talk-reactions) здесь нет, как нет и тех же
# событий: тест остаётся честным. make_voice.py ставит каждую фразу в уста героя разным NPC.

