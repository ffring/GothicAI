[package]
name = "gothic-launcher"
version = "0.1.0"
description = "Gothic AI launcher: the game and its AI services with one button"
edition = "2021"

[lib]
name = "gothic_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
libc = "0.2"

# Cargo strips release builds by default, proc macros included, and this macOS's dyld refuses the
# stripped proc-macro dylibs ("mis-aligned LINKEDIT string pool"); release builds carry no debug info
# anyway, so there is little to strip
[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
