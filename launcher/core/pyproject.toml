[project]
name = "gothic-launcher"
version = "0.1.0"
description = "Starts the AI services and the game with one command; settings and API keys in one place"
authors = [
    { name = "Kaifat", email = "11953142+kaifaty@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
gothic-launcher = "gothic_launcher.cli:main"

[tool.uv.build-backend]
module-name = "gothic_launcher"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# tests poll files and pids that have no event to wait on
"tests/*" = ["ASYNC109", "ASYNC110"]
