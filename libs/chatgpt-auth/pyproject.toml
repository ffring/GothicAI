[project]
name = "chatgpt-auth"
version = "0.1.0"
description = "Sign in with ChatGPT for local apps: OAuth PKCE login and a shared, refreshing token store"
authors = [
    { name = "Kaifat", email = "11953142+kaifaty@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[tool.uv.build-backend]
module-name = "chatgpt_auth"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# login(timeout=...) is the user-facing deadline for the browser sign-in
ignore = ["ASYNC109"]
