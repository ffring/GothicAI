# Эталон для вопроса escalate (server/src/gothic_ai/brain/situation.py): насколько момент требует, чтобы
# NPC заговорил своими словами и продумал дальнейшее, то есть стоит ли звать большую модель.
#   0 — рутина: хватит ничего не делать или простого действия;
#   1 — хватит стандартной реплики или жеста;
#   2 — стоит короткой своей реплики, не больше;
#   3 — нужна настоящая речь своими словами (крикнуть, умолять, спорить, объяснить) или у NPC личное дело
#       к герою: новость, долг, обещание, обида, благодарность;
#   4 — поворотный момент: угроза жизни, большая потеря или удача, что-то о его целях; нужна речь и план.
# Расставлен вручную (Claude) по тексту сцен до просмотра ответов моделей по новой шкале. Формат:
# id: [эталон, приемлемые...]. «Звать большую модель» — уровень 3 и выше.

