# Набор ситуаций для decision-моделей (слой «рефлексов» NPC).
#
# Каждая ситуация — то, что сервер отправил бы модели в момент события:
#   state_en — состояние по-английски, реплики героя по-русски (так планируем в проде);
#   state_ru — то же целиком по-русски.
# Вопросы:
#   react    — choice «что делаешь сейчас», варианты свои у каждой ситуации;
#   think    — noul «нужен ли продуманный ответ большой модели»;
#   attitude — score, как изменилось отношение к герою (0 сильно хуже … 4 сильно лучше);
#   extra    — иногда второй choice с параметром: предмет, кого звать, куда идти.
# gold — эталон, ok — тоже приемлемые ответы. Эталон расставлен вручную (Claude) по смыслу сцены.
# Реплики svm_* — родные озвученные фразы SVM, текст из русского OU.BIN.

questions:
  react:
    instructions: What do you do right now?
  think:
    instructions: >-
      Does this moment call for a thoughtful, unscripted spoken response from you,
      something that a stock phrase or a simple action cannot cover?
    criteria:
      "true": >-
        The hero engages you with something specific (a question, request, offer, accusation,
        news) or the situation is unusual and personal, so the answer must be composed for it.
      "false": >-
        Doing nothing, a simple action or a stock phrase is enough.
  attitude:
    instructions: How does what just happened change your attitude toward the hero?
    levels:
      - much worse (a serious offense, a threat, a crime against you)
      - slightly worse (rude, suspicious or annoying)
      - unchanged
      - slightly better (polite, a small favor, good business)
      - much better (saved you, a big gift, a great service)

situations:

# ───────────── угрозы и преступления ─────────────

- id: lothar_weapon_drawn
  tags: [threat]
  state_en: >-
    You are Lothar, a paladin guarding the gate to the upper quarter of Khorinis. Stern, loyal to
    the king, not easily scared. It is 22:10, night. The hero (no guild, farmer's clothes) is 3 m
    away and has just drawn a sword. He says nothing.
  state_ru: >-
    Ты — Лотар, паладин, охраняешь ворота в верхний квартал Хориниса. Суровый, верен королю, тебя
    трудно напугать. 22:10, ночь. Герой (без гильдии, в одежде крестьянина) в 3 м от тебя и только
    что обнажил меч. Он молчит.
  react:
    options:
      continue: keep standing guard and ignore him
      svm_weapon_down: "shout a warning: 'Put that weapon away!'"
      attack: attack the hero right away
      call_guards: "shout 'GUARDS!' for help"
      step_back: step back and watch him
    gold: svm_weapon_down
  think: false
  attitude: {gold: 1, ok: [0]}

