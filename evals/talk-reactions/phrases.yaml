# Быстрая реакция NPC на фразу героя: какой звук он издаёт сразу, пока думает над ответом
# (вопрос `voice` в server/src/gothic_ai/brain/reflex.py, фразы — server/src/gothic_ai/fillers.py).
#
#   none        — ничего, ответ сразу: приветствие, прощание, «спасибо», болтовня;
#   think       — «Хм...»: вопрос, над которым надо подумать;
#   ack         — «Угу.»: обычное сообщение, принёс то, что просили;
#   surprise    — «Что?!»: неожиданная или тревожная новость;
#   displeasure — «Тьфу!»: оскорбление, насмешка, угроза, обвинение во лжи, грубое требование;
#   doubt       — «Ой ли?»: хвастовство, сомнительное заявление.
#
# good — что подходит, первое — лучшее. Разметка вручную (Claude), по смыслу фразы и характеру NPC.

npcs:
  xardas:
    id: NONE_100_XARDAS
    name: Ксардас
    # TRAITS из persona.py: так состояние выглядит в игре
    traits: >-
      A powerful necromancer who once was a Fire Mage. Aloof, proud and wise; the hero's mentor.
      He does not fight the hero's battles, but he is no coward.
    distance_cm: 200
    clock: "15:30"
    intent: {goal: keep_routine, attitude: friendly}
  lobart:
    id: BAU_950_LOBART
    name: Лобарт
    traits: >-
      A farmer who owns the big farm near Khorinis. Practical, grumpy and tight with money, but fair
      to honest workers.
    distance_cm: 150
    clock: "10:00"
    intent: {goal: keep_routine, attitude: neutral}
  guard:
    id: MIL_309_STADTWACHE
    name: Стражник
    traits: >-
      A militiaman guarding the city gate of Khorinis. Stern and suspicious of strangers, proud of the
      uniform.
    distance_cm: 250
    clock: "18:45"
    intent: {goal: keep_routine, attitude: neutral}

phrases:
  # --- Ксардас
  - {npc: xardas, say: "Привет, Ксардас!", good: [none]}
  - {npc: xardas, say: "Здравствуй, старик.", good: [none]}
  - {npc: xardas, say: "Пока.", good: [none]}
  - {npc: xardas, say: "Мне пора, до встречи.", good: [none]}
  - {npc: xardas, say: "Спасибо за помощь.", good: [none]}
  - {npc: xardas, say: "Как дела?", good: [none]}
  - {npc: xardas, say: "Да.", good: [none, ack]}
  - {npc: xardas, say: "Хорошо, я так и сделаю.", good: [none, ack]}
  - {npc: xardas, say: "Как победить драконов?", good: [think]}
  - {npc: xardas, say: "Что ты знаешь о Беллиаре?", good: [think]}
  - {npc: xardas, say: "Почему ты стал некромантом?", good: [think]}
  - {npc: xardas, say: "Что мне делать дальше?", good: [think]}
  - {npc: xardas, say: "Можешь научить меня магии?", good: [think]}
  - {npc: xardas, say: "Расскажи мне о Долине рудников.", good: [think]}
  - {npc: xardas, say: "Где мне найти Глаз Инноса?", good: [think]}
  - {npc: xardas, say: "Мне нужен совет.", good: [think, ack]}
  - {npc: xardas, say: "Кто ты такой?", good: [think, none]}
  - {npc: xardas, say: "Я принёс тебе травы, как ты просил.", good: [ack]}
  - {npc: xardas, say: "Лестер передал тебе привет.", good: [ack, none]}
  - {npc: xardas, say: "Я поговорил с лордом Хагеном.", good: [ack]}
  - {npc: xardas, say: "Я был в монастыре.", good: [ack]}
  - {npc: xardas, say: "Я выполнил твоё поручение.", good: [ack]}
  - {npc: xardas, say: "Орки напали на город!", good: [surprise]}
  - {npc: xardas, say: "Я нашёл Глаз Инноса!", good: [surprise]}
  - {npc: xardas, say: "Драконы вернулись в Долину рудников!", good: [surprise]}
  - {npc: xardas, say: "Лестер мёртв.", good: [surprise]}
  - {npc: xardas, say: "Внизу у башни стоит отряд паладинов!", good: [surprise]}
  - {npc: xardas, say: "Ты старый дурак.", good: [displeasure]}
  - {npc: xardas, say: "Ты врёшь!", good: [displeasure]}
  - {npc: xardas, say: "Заткнись, старик.", good: [displeasure]}
  - {npc: xardas, say: "Твоя башня скоро рухнет, а ты вместе с ней.", good: [displeasure]}
  - {npc: xardas, say: "Ты что, совсем из ума выжил?", good: [displeasure]}
  - {npc: xardas, say: "От тебя никакого толку.", good: [displeasure]}
  - {npc: xardas, say: "Я убил дракона голыми руками.", good: [doubt]}
  - {npc: xardas, say: "Я сильнее любого мага.", good: [doubt]}
  - {npc: xardas, say: "Я теперь король Миртаны.", good: [doubt]}
  - {npc: xardas, say: "Я уже знаю о магии всё.", good: [doubt]}
  # --- Лобарт
  - {npc: lobart, say: "Здорово, Лобарт.", good: [none]}
  - {npc: lobart, say: "Ну, бывай.", good: [none]}
  - {npc: lobart, say: "Сколько ты заплатишь за работу?", good: [think]}
  - {npc: lobart, say: "Как добраться до города?", good: [think, none]}
  - {npc: lobart, say: "Я выгнал овец на пастбище.", good: [ack]}
  - {npc: lobart, say: "Я прогнал наёмников с твоей фермы.", good: [ack, surprise]}
  - {npc: lobart, say: "Стражники идут сюда за твоим урожаем!", good: [surprise]}
  - {npc: lobart, say: "На твоих полях полно падальщиков!", good: [surprise, ack]}
  - {npc: lobart, say: "Дай мне денег. Быстро.", good: [displeasure]}
  - {npc: lobart, say: "Ты жадный старый крестьянин.", good: [displeasure]}
  - {npc: lobart, say: "Я один вспахал бы всё твоё поле за час.", good: [doubt]}
  - {npc: lobart, say: "Я лучший работник на всём острове.", good: [doubt]}
  # --- стражник у ворот
  - {npc: guard, say: "Добрый день.", good: [none]}
  - {npc: guard, say: "Можно мне пройти в город?", good: [think, none]}
  - {npc: guard, say: "Где тут кузница?", good: [think, none]}
  - {npc: guard, say: "Я пришёл с фермы Лобарта.", good: [ack]}
  - {npc: guard, say: "За воротами бродит стая волков!", good: [surprise]}
  - {npc: guard, say: "В порту кто-то поджёг склад!", good: [surprise]}
  - {npc: guard, say: "С дороги, болван.", good: [displeasure]}
  - {npc: guard, say: "Ваша стража — сборище трусов.", good: [displeasure]}
  - {npc: guard, say: "Я паладин короля, пропусти меня.", good: [doubt]}
  - {npc: guard, say: "Я в одиночку перебил всю банду разбойников.", good: [doubt]}
