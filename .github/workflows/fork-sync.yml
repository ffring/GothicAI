# Brings the author's main (kaifaty/GothicAI) into this fork's main once a day and on Run workflow:
# scripts/fork-sync.sh pushes an ordinary merge commit without force, so the fork's own commits stay as they
# are. On a conflict, on workflow files from the author or on a refused push it pushes nothing and the run
# fails with the reason in its summary. It writes nothing to the author's repository, touches no other
# branch, builds and tests nothing. What to do on a red run: docs/fork-sync.md.
name: Fork sync

on:
  schedule:
    - cron: "17 3 * * *"  # daily, 03:17 UTC; GitHub may start a scheduled run late
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check whether the author's main merges cleanly, push nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM: kaifaty/GothicAI  # fixed here, not an input

jobs:
  sync:
    # only this fork and only from main: the author's repository and forks of this fork skip the job
    if: github.repository == 'ffring/GothicAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the merge commit on this fork's main; the token reaches no other repository
    steps:
      - name: This repository is a fork of the author's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // ""')
          if [ "$parent" != "$UPSTREAM" ]; then
            echo "::error::$GITHUB_REPOSITORY is a fork of '${parent:-nothing}', not of $UPSTREAM"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the merge base needs the whole history
          sparse-checkout: scripts/fork-sync.sh  # the merge needs no working tree, only this script
          sparse-checkout-cone-mode: false

      - name: Merge the author's main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          bash scripts/fork-sync.sh "https://github.com/$GITHUB_REPOSITORY.git" "https://github.com/$UPSTREAM.git"
          ${{ inputs.dry_run && '--dry-run' || '' }}
